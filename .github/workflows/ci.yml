# Runs on every push and pull request. A PR merges only when this is green.
# Not yet: ruff, mypy, eslint, vitest (each is a new dev dependency; ask first, see backlog).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The CI token may only read the code (it never needs to push or comment)
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kjs_test
          POSTGRES_USER: kjs_test
          POSTGRES_PASSWORD: kjs_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kjs_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -r requirements.txt
      - run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # next-env.d.ts and the route types are generated (not in git): create them before tsc,
      # or type checks that need Next's types (e.g. importing an image) would fail here
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
