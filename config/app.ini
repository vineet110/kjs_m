; General app settings. Edit and save: applies within a few seconds, no restart.
; Any key can be overridden by an env var, e.g. KJS__APP__PAGE_SIZE=100
[app]
; Shown in page titles and emails
site_name = KJS India
; Staff see times in this zone (stored in UTC)
timezone = Asia/Kolkata
; Max rows per list page
page_size = 50
; Enquiry forms allowed per visitor IP per hour
lead_rate_per_hour = 5
; Koko chat messages allowed per visitor IP per hour
koko_rate_per_hour = 40
; Wrong passwords allowed per network per 15 minutes, over all emails (only wrong ones count:
; the whole office shares one address)
login_failures_per_ip = 100
; Staff sign-ups allowed per network per hour (everyone signs up from the office on go-live day)
signups_per_ip_per_hour = 30
; Background checks (SLA, alerts, auto-assign): on/off, how often (seconds), and when.
; Outside these hours (IST, Mon-Sat) nothing runs, so the database can sleep (saves Neon hours)
jobs_enabled = false
jobs_interval_seconds = 60
jobs_hours = 08:00-21:00
; Default shift (IST). Check-in later than shift_start + late_after_minutes = late
shift_start = 09:30
shift_end = 18:30
late_after_minutes = 15
