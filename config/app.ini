; General app settings
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file,
; e.g. KJS__APP__JOBS_ENABLED=true.
; ------------------------------------------------------------------
[app]
; Shown in page titles and emails. Allowed: any text. Default: KJS India
site_name = KJS India
; Staff see times in this zone (times are stored in UTC).
; Allowed: a time zone name, exact spelling and capitals (e.g. Asia/Kolkata). Default: Asia/Kolkata
timezone = Asia/Kolkata
; Enquiry forms allowed per visitor IP per hour. Allowed: 1 or more. Default: 5
lead_rate_per_hour = 5
; Koko chat messages allowed per visitor IP per hour. Allowed: 1 or more. Default: 40
koko_rate_per_hour = 40
; Excel / CSV files a staff member may read into the New internal lead form, per hour.
; Allowed: 1 or more. Default: 60
lead_file_reads_per_hour = 60
; Wrong passwords allowed per network per 15 minutes, over all emails (only wrong ones count:
; the whole office shares one address). Allowed: 1 or more. Default: 100
login_failures_per_ip = 100
; Staff sign-ups allowed per network per hour (everyone signs up from the office on go-live day).
; Allowed: 1 or more. Default: 30
signups_per_ip_per_hour = 30
; true = staff must verify their email before they can log in (the safe setting).
; false = they may log in without it; admin approval still guards every new account.
; Now false: Firebase's "verify your email" mails often land in spam (backlog R126.iv) and most staff
; accounts aren't verified yet. Set true once every real staff account is verified.
; Allowed: true / false. Default: true
require_verified_email = false
; Background jobs (SLA alerts, emails, auto-assign, lead harvester): on or off.
; Allowed: true / false. Default: false (a broken file never switches them on by itself)
jobs_enabled = false
; How often the background jobs run, in seconds. Allowed: 5 or more. Default: 60
jobs_interval_seconds = 60
; When they run (IST, Mon-Sat). Outside these hours nothing runs, so the database can sleep.
; Allowed: HH:MM-HH:MM, 24-hour, two digits each (08:00-21:00, not 8:00-21:00). Default: 08:00-21:00
jobs_hours = 08:00-21:00
; A stuck job is cancelled after this many seconds, so it can't block the others.
; Allowed: 30 to 1800, and at least notifications.ini email_time_budget_seconds + 30. Default: 300
job_timeout_seconds = 300
; Default shift (IST). Check-in later than shift_start + late_after_minutes = late.
; Allowed: HH:MM, 24-hour, two digits each (09:30); shift_start before shift_end. Default: 09:30 and 18:30
shift_start = 09:30
shift_end = 18:30
; Allowed: 0 or more (minutes). Default: 15
late_after_minutes = 15
