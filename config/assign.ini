; Auto-assign of record batches
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[assign]
; Records per batch. Allowed: 1 to 500. Default: 20
batch_size = 20
; Batches one employee can get per day. Allowed: 1 or more. Default: 3
max_batches_per_day = 1
; Only assign inside these hours (IST).
; Allowed: HH:MM, 24-hour, two digits each (09:30); work_start before work_end. Default: 09:30 and 18:30
work_start = 09:30
work_end = 18:30
; Biggest Excel / CSV file of records, in MB. nginx caps uploads at 26 MB (deploy/nginx/default.conf):
; raise both together. Allowed: 1 to 25. Default: 10
import_max_mb = 10
; Most rows in that file. Allowed: 10 to 50000. Default: 5000
import_max_rows = 5000
