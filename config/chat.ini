; KJS Chat (channels, groups, direct messages). Edit and save: applies within a few seconds.
; Any key can be overridden by an env var, e.g. KJS__CHAT__BODY_MAX=8000
[chat]
; Messages one person may send per minute (stops a stuck key or a script flooding a channel)
send_per_minute = 30
; Most messages one request may load (older messages load in pages of up to this many)
page_max = 100
; Longest message, in characters (the message box stops typing at this length)
body_max = 4000
