; "Report a problem" in the portal (bugs, issues, suggestions)
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[complaints]
; Who gets each new complaint by email. NOT USED YET: complaints are only saved in the
; database until sending email is set up. Change it here, no code change needed.
; Allowed: one email address, or empty. Not checked, so copy it carefully. Default: empty
developer_email =
; Words needed in a complaint's title and description (the form counts them as you type).
; Allowed: title 1 to 20, description 1 to 100. Default: 3 and 15
min_title_words = 3
min_description_words = 15
; Complaints shown on /admin/complaints, newest first. Allowed: 50 to 2000. Default: 200
list_limit = 200
