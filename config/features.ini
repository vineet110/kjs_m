; Turn website features on or off. true = on, false = off.
; No deploy needed. The website updates within about 1 minute.
[features]
; Koko chat bot
koko = true
; Moving offers strip at the top of the site
offers_ticker = true
; Product builder. Off until KJS gives us prices (backlog I3)
configurator = false
; Partners page
partners = true
; Forms on product pages: price sheet, spec PDF, sample, quote
gated_actions = true
; Green WhatsApp button in the corner
whatsapp_button = true
; "Let's connect" popup. Shows after 8 s; if closed, again after 30 s, then after 60 s
connect_popup = true
