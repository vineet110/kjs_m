; Turn website features on or off. The website updates within about 1 minute, no deploy.
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
; Every key below: Allowed: true / false.
[features]
; Koko chat bot. Default: true
koko = true
; Moving offers strip at the top of the site. Default: true
offers_ticker = true
; Product builder. Off until KJS gives us prices (backlog I3). Default: false
configurator = false
; Partners page. Default: true
partners = true
; Forms on product pages: price sheet, spec PDF, sample, quote. Default: true
gated_actions = true
; Green WhatsApp button in the corner. Default: true
whatsapp_button = true
; "Let's connect" popup. Shows after 8 s; if closed, again after 30 s, then after 60 s. Default: true
connect_popup = true
