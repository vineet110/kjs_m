; Koko chat. The model and provider are in .env (LLM_PROVIDER, LLM_MODEL)
[koko]
; 0 = always the same answer, higher = more creative , MAX_INTEGER=2
temperature = 0.3
; Longest reply : Koko can give (tokens). 1 token = ~4 chars in English, so 700 tokens = ~2800 chars
max_tokens = 700
; Most AI calls per day for all visitors together (a cost cap). After that Koko shows the
; "please use the form / WhatsApp" message until midnight (IST)
daily_limit = 2000
