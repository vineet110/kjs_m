; Koko chat. The model and provider are in .env (LLM_PROVIDER, LLM_MODEL)
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[koko]
; 0 = always the same answer, higher = more creative.
; Allowed: 0 to 2, decimals allowed (use a dot: 0.3). Default: 0.3
temperature = 0.3
; Longest reply Koko can give, in tokens. 1 token = about 4 characters in English (700 = about 2800).
; Allowed: 50 to 4000. Default: 700
max_tokens = 700
; Most AI calls per day for all visitors together (a cost cap). After that Koko shows the
; "please use the form / WhatsApp" message until midnight (IST). Allowed: 0 to 100000. Default: 2000
daily_limit = 2000
; Products given to the AI per message. Allowed: 1 to 30. Default: 8
prompt_products = 8
; Products shown on the catalogue card. Allowed: 1 to 20. Default: 6
card_products = 6
; Longest system prompt, in characters (about 4 per token). Fewer products go in when it's over.
; Allowed: 2000 to 60000. Default: 8000
prompt_limit = 8000
; Seconds for the whole AI call (then Koko says "please use the form / WhatsApp"); nginx gives up at 60.
; Allowed: 5 to 55. Default: 25
timeout_seconds = 25
; Seconds for one HTTP request to the AI provider.
; Allowed: 5 to 55, and not more than timeout_seconds. Default: 20
http_timeout_seconds = 20
; Longest chat line, in characters (a visitor's message or a saved Koko reply).
; Allowed: 200 to 10000, and not more than chat_max. Default: 2000
message_max = 2000
; Longest whole chat sent to the AI, in characters (older lines are left out).
; Allowed: 1000 to 60000. Default: 8000
chat_max = 8000
; Newest chat lines the AI is sent with each question. Allowed: 2 to 40. Default: 12
history_lines = 12
; Chat lines kept per conversation (Admin > Koko). Allowed: 10 to 200. Default: 40
transcript_lines = 40
; Chat lines the widget may send in one request (the server reads its own saved copy of Koko's lines).
; Allowed: 2 to 400. Default: 60
request_lines = 60
