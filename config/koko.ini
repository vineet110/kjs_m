; Koko chat. The model and provider are in .env (LLM_PROVIDER, LLM_MODEL)
[koko]
; 0 = always the same answer, higher = more creative , MAX_INTEGER=2
temperature = 0.3
; Longest reply : Koko can give (tokens). 1 token = ~4 chars in English, so 700 tokens = ~2800 chars
max_tokens = 700
; Most AI calls per day for all visitors together (a cost cap). After that Koko shows the
; "please use the form / WhatsApp" message until midnight (IST)
daily_limit = 2000
; Products given to the AI per message, and shown on the catalogue card
prompt_products = 8
card_products = 6
; Longest system prompt, in characters (about 4 per token). Fewer products go in when it's over.
prompt_limit = 8000
; Seconds for the whole AI call (then Koko says "please use the form / WhatsApp"); keep under 60 (nginx)
timeout_seconds = 25
; Seconds for one HTTP request to the AI provider (not more than timeout_seconds)
http_timeout_seconds = 20
; Longest chat line, in characters (a visitor's message or a saved Koko reply)
message_max = 2000
; Longest whole chat sent to the AI, in characters (older lines are left out)
chat_max = 8000
; Newest chat lines the AI is sent with each question
history_lines = 12
; Chat lines kept per conversation (Admin > Koko)
transcript_lines = 40
; Chat lines the widget may send in one request (the server reads its own saved copy of Koko's lines)
request_lines = 60
