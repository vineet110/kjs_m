; Lead limits. The SLA minutes (respond, resolve, escalate) are in sla.ini.
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[leads]
; A lead shows "due soon" when its target is this many minutes away. Allowed: 0 to 120. Default: 5
due_soon_minutes = 5
; Biggest Excel / CSV file read into the New internal lead form or bulk-imported, in MB.
; nginx caps uploads at 26 MB (deploy/nginx/default.conf): raise both together. Allowed: 1 to 25. Default: 10
file_max_mb = 10
; Rows shown to pick one lead from a file. Allowed: 1 to 500. Default: 50
file_preview_rows = 50
; Bulk import: most rows in one file (each row becomes a lead). Allowed: 1 to 5000. Default: 500
import_max_rows = 500
; Leads loaded per page; "Load more" fetches the next page. Bigger = slower page.
; An employee's lists (own leads + unassigned ones). Allowed: 50 to 1000. Default: 200
employee_page_size = 200
; All Enquiries and the other lists of someone who sees every lead. Allowed: 50 to 2000. Default: 500
admin_page_size = 500
