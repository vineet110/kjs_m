; Lead limits. The SLA minutes (respond, resolve, escalate) are in sla.ini.
[leads]
; A lead shows "due soon" when its target is this many minutes away
due_soon_minutes = 5
; nginx caps uploads at 26 MB (deploy/nginx/default.conf): 25 at most here; raise both together
; Biggest Excel / CSV file read into the New internal lead form or bulk-imported, in MB
file_max_mb = 10
; Rows shown to pick one lead from a file
file_preview_rows = 50
; Bulk import: most rows in one file (each row becomes a lead)
import_max_rows = 500
