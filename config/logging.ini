; Backend logs (printed in the terminal). Changes apply within seconds, no restart.
;
; How to debug a problem:
;   1. Set level = DEBUG below (or only the one module, see [logging.levels])
;   2. Repeat the action that breaks, then read the terminal
;   3. Done? Set it back to INFO (DEBUG is very noisy)
;   On your own laptop only: show_personal_data = true shows full emails/phones
[logging]
; How much detail. Most to least: DEBUG, INFO, WARNING, ERROR. Normal = INFO
level = INFO
; pretty = easy to read on your laptop. json = for servers
format = pretty
; false = hide emails/phones (om***@alnoor.ae). Never true on the live site
show_personal_data = false

; Give one part of the code its own level. Example, to debug only leads:
; app.services.lead_service = DEBUG
[logging.levels]
; Database library is very noisy below WARNING, keep it quiet
sqlalchemy.engine = WARNING
