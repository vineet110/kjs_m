; Backend logs (printed in the terminal)
;
; How to debug a problem:
;   1. Set level = DEBUG below (or only the one module, see [logging.levels])
;   2. Repeat the action that breaks, then read the terminal
;   3. Done? Set it back to INFO (DEBUG is very noisy)
;   On your own laptop only: show_personal_data = true shows full emails/phones
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[logging]
; How much detail, most to least: DEBUG, INFO, WARNING, ERROR, CRITICAL. Normal = INFO.
; Allowed: one of those five, in CAPITALS (info or Info is refused). Default: INFO
level = INFO
; pretty = easy to read on your laptop. json = for servers.
; Allowed: pretty / json, lowercase (any other word, even JSON, gives pretty). Default: pretty
format = pretty
; false = hide emails/phones (om***@alnoor.ae). Never true on the live site.
; Allowed: true / false. Default: false
show_personal_data = false

; Give one part of the code its own level. Example, to debug only leads:
; app.services.lead_service = DEBUG
; Allowed: <code module name> = DEBUG / INFO / WARNING / ERROR / CRITICAL (CAPITALS only)
[logging.levels]
; Database library is very noisy below WARNING, keep it quiet
sqlalchemy.engine = WARNING
