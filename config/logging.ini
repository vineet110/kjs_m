; Logs go to stdout. Change a level here and it applies within seconds.
[logging]
; DEBUG, INFO, WARNING, ERROR
level = INFO
; pretty (easy to read on a dev machine) or json (staging, production)
format = pretty
; true shows full emails/phones in logs. Never true in production
show_personal_data = false

; One line per module that needs a different level, e.g.
; app.services.lead_service = DEBUG
[logging.levels]
sqlalchemy.engine = WARNING
