; Portal areas, released in phases. Who can see each area:
;   on    = everyone
;   admin = admins only (try it on the live site first)
;   off   = nobody (hidden in the menu, closed in the API, its background jobs stop)
; Off only hides an area; no data is deleted. Applies within about a minute.
;
; Always on (no switch): Leads, Tasks, My day, Profile, Approvals, Manage users, Overview, Settings, Holidays.
; Rule: batches needs attendance (batches go only to staff who checked in). So batches = on needs
; attendance = on, and batches = admin needs attendance = admin or on.
; Rule: site_insights needs analytics the same way (it is a tab on the Reports page).
; Rule: monitoring needs attendance the same way (the laptop is only watched while someone is checked in).
;
; ---------- How to edit ----------
; One setting per line: area = level. Text after ; is a note. Never use the percent sign.
; Every key below: Allowed: on / admin / off (capitals and spaces don't matter: On is fine).
; Unlike the other config files, a misspelt area name IS caught here: like a wrong value or a broken
; rule, the whole file is refused, its last good settings stay, and the log says why.
; Default = the level used when the line is missing: on for every area except site_insights and monitoring (off).
; A server env var KJS__MODULES__<AREA> beats this file.
; ---------------------------------
[modules]
; Basic release (18 Nov): leads, employees, dashboard, website, reports. Attendance: admins only.
; My batches, Auto-assign
batches = off
; Order boards (employee and admin), their files and alerts
order_boards = off
; Attendance, Team attendance, leave, shifts, "receiving tasks" (Holidays stay on: lead SLA uses them)
attendance = admin
; All Products, SEO & Partners, Manage KOKO
website_admin = on
; Analytics page
analytics = on
; Alerts page
alerts = on
; Audit log page
audit = on
; Chat (channels, groups, direct messages)
chat = off
; Client Schedulers (Lead Harvester): its page and its background job
lead_harvester = off
; Website insights tab on Reports (needs analytics on). Off = the website stops recording visitors.
; Settings: site_insights.ini
site_insights = on
; Laptop monitoring: the attendance feed and instant push to the monitoring server (needs attendance).
; Off = the feed answers 404 and nothing is pushed. Settings: monitoring_link.ini
monitoring = off
