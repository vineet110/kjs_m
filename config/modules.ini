; Portal areas, released in phases. Who can see each area:
;   on    = everyone
;   admin = admins only (try it on the live site first)
;   off   = nobody (hidden in the menu, closed in the API, its background jobs stop)
; Off only hides an area; no data is deleted. Applies within about a minute.
;
; Always on (no switch): Leads, Tasks, My day, Profile, Approvals, Manage users, Overview, Settings.
; Rule: batches needs attendance (batches go only to staff who checked in). So batches = on needs
; attendance = on, and batches = admin needs attendance = admin or on.
; A typo or a broken rule is refused: the last good settings stay, and the log says why.
[modules]
; My batches, Auto-assign
batches = on
; Order boards (employee and admin), their files and alerts
order_boards = on
; Attendance, Team attendance, Holidays, leave, shifts, "receiving tasks"
attendance = on
; All Products, SEO & Partners, Manage KOKO
website_admin = on
; Analytics page
analytics = on
; Alerts page
alerts = on
; Audit log page
audit = on
; Chat (channels, groups, direct messages)
chat = on
; Client Schedulers (Lead Harvester): its page and its background job
lead_harvester = on
