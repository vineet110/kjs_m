; Team work (admin) and My work (employee). Edit and save: applies within a few seconds, no restart.
; Any key can be overridden by an env var, e.g. KJS__MONITORING__MAX_RANGE_DAYS=14
; The whole area is switched on/off in modules.ini (monitoring = on / admin / off).
[monitoring]
; Longest date range (days) one page may show. Bigger = slower pages.
max_range_days = 31
; Timeline items loaded at a time ("Load more" gets the next lot)
timeline_page_size = 200
; How often the Team work page refreshes itself (seconds)
team_refresh_seconds = 30

; ---- Screenshots (Phase B) ----
; One screenshot every N minutes while checked in (paused on a break)
screenshot_minutes = 15
; Screenshots older than this many days are deleted (the files and their rows)
keep_days = 30
; JPEG quality 10-95. Lower = smaller files, blurrier text
image_quality = 60
; Bigger uploads are refused (KB)
max_screenshot_kb = 600
; Screen sharing off for this many minutes while checked in = admins are told (0 = at once)
gap_alert_minutes = 5

; ---- Breaks ----
; Break minutes allowed per day. Going over tells admins once that day
break_minutes_per_day = 60

; ---- Idle (needs the browser extension) ----
; No activity this long = idle, and the employee sees a warning. Shorter pauses never count
idle_warn_minutes = 15
; Still idle at this many minutes = admins are told (once per idle period)
idle_admin_minutes = 30
