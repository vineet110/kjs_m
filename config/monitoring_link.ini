; The link to the laptop-monitoring server (backend/app/services/monitoring_link_service.py).
; The monitoring server polls our attendance feed every 30 s. Its key is MONITORING_FEED_KEY in .env (not here).
; Switch: monitoring in modules.ini (off = the feed answers 404 and the auto-out job stops).
[monitoring_link]
; Each poll reads back this many seconds, so an event saved by a slow transaction is never missed (10-600)
feed_overlap_seconds = 60
; Most events in one poll; the rest come on the next poll (100-10000)
feed_max_rows = 2000
; Forgotten check-out: monitoring stops at shift end + this many minutes. CRM attendance is not changed:
; the person still sends a missed-punch request (15-480)
auto_out_grace_minutes = 60
; A check-in AFTER shift end (overtime, evening work with no shift): monitoring stops this many hours later (1-12)
overtime_auto_out_hours = 4
; Each change is pushed to the monitoring server the moment it is saved; one push may take this long before
; it gives up (the 30 s poll then delivers it). Seconds (0.5-30)
push_timeout_seconds = 3
; Events older than this are deleted. The monitoring server reads at most 31 days back (31-730)
keep_events_days = 90
