; Laptop monitoring link: the attendance feed the monitoring server reads, and the instant push to it
; (backend/app/services/monitoring_link_service.py). Its keys and address are in .env (MONITORING_*), not here.
; Switch: monitoring in modules.ini.
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[monitoring_link]
; Each poll reads back this many seconds, so an event saved by a slow transaction is never missed.
; Allowed: 10 to 600. Default: 60
feed_overlap_seconds = 60
; Most events in one poll; the rest come on the next poll. Allowed: 100 to 10000. Default: 2000
feed_max_rows = 2000
; Forgotten check-out: monitoring stops at shift end + this many minutes. CRM attendance is not changed:
; the person still sends a missed-punch request. Allowed: 15 to 480. Default: 60
auto_out_grace_minutes = 60
; A check-in AFTER shift end (overtime, evening work with no shift): monitoring stops this many hours
; after that check-in if nobody checks out. Allowed: 1 to 12. Default: 4
overtime_auto_out_hours = 4
; One push to the monitoring server gives up after this many seconds (the 30 s poll then delivers the
; change). Decimals are fine. Allowed: 0.5 to 30. Default: 3
push_timeout_seconds = 3
; A monitoring page asking the monitoring server gives up after this many seconds. Allowed: 1 to 30. Default: 5
call_timeout_seconds = 5
; Monitoring pages reload at once when something changes (pushed); they also reload this often anyway, in
; case a push was lost. Seconds. Allowed: 10 to 600. Default: 60
page_refresh_seconds = 60
; The live stream to open monitoring pages sends a keep-alive this often, so proxies don't close it.
; Seconds. Allowed: 5 to 60. Default: 20
stream_ping_seconds = 20
; Events older than this many days are deleted (the monitoring server reads at most 31 days back).
; Allowed: 31 to 730. Default: 90
keep_events_days = 90
