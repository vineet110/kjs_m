; Website insights (Reports > Website insights): what visitors view, search and click on the website.
; Anonymous: no cookie, no IP address, no name. Staff (logged in) and robots are not counted.
; The whole feature is switched on and off in modules.ini (site_insights).
[site_insights]
; Days visitor events are kept, then deleted (30 to 730)
keep_days = 180
; How often old events are deleted (hours). It runs when the website sends events or the report opens.
cleanup_every_hours = 6
; Range shown when the report opens, and the range buttons above it (days). Both must fit in keep_days.
default_days = 30
day_choices = 7, 30, 90
; Rows in each "top" list (top products, top searches, ...)
top_n = 10
; A browser sends what it collected every few seconds, at most this many events at a time
send_every_seconds = 10
max_events_per_send = 20
; Sends allowed per minute, per visit (one tab sends about 6) and per network (many mobile visitors can
; share one network address, so keep it high). More are dropped quietly: stops scripts filling the table.
sends_per_minute_per_visit = 20
sends_per_minute_per_network = 600
; A search is recorded after the visitor stops typing for this long (milliseconds), if it is long enough
search_pause_ms = 1500
min_search_chars = 2
; Buttons whose clicks are counted. Each is tagged data-track="<name>" on the website.
; Adding a name here does nothing until a button is tagged with it.
buttons = add_to_enquiry, spec_sheet, price_sheet, whatsapp, call, send_enquiry, configurator, sample_quote
; Website pages counted by their address. Product and category pages count when the product or category
; exists. Any other address is saved as "other" (it could carry anything, like an email). Add new pages here.
pages = /, /products, /categories, /contact, /partners, /private-label
; Visitors whose browser name contains one of these words are robots (search engines, link previews)
bot_words = bot, crawl, spider, slurp, headless, lighthouse, preview, curl, wget, python, httpclient, facebookexternalhit
