; Website insights (Reports > Website insights): what visitors view, search and click on the website.
; Anonymous: no cookie, no IP address, no name. Staff (logged in) and robots are not counted.
; The whole feature is switched on and off in modules.ini (site_insights).
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[site_insights]
; Days visitor events are kept, then deleted. Allowed: 30 to 730. Default: 180
keep_days = 180
; How often old events are deleted (hours). It runs when the website sends events or the report opens.
; Allowed: 1 to 168. Default: 6
cleanup_every_hours = 6
; Range shown when the report opens (days). Allowed: 1 to 365, and at most keep_days. Default: 30
default_days = 30
; Range buttons above the report (days). Allowed: whole numbers 1 to 730, comma separated; at least one
; must be at most keep_days. Default: 7, 30, 90
day_choices = 7, 30, 90
; Rows in each "top" list (top products, top searches, ...). Allowed: 3 to 50. Default: 10
top_n = 10
; A browser sends what it collected every this many seconds. Allowed: 2 to 120. Default: 10
send_every_seconds = 10
; ... at most this many events at a time. Allowed: 1 to 100. Default: 20
max_events_per_send = 20
; Sends allowed per minute, per visit (one tab sends about 6) and per network (many mobile visitors can
; share one network address, so keep it high). More are dropped quietly: stops scripts filling the table.
; Allowed: per visit 5 to 600, per network 30 to 10000. Default: 20 and 600
sends_per_minute_per_visit = 20
sends_per_minute_per_network = 600
; A search is recorded after the visitor stops typing for this long (milliseconds), if it is long enough.
; Allowed: pause 300 to 10000, search length 1 to 10 characters. Default: 1500 and 2
search_pause_ms = 1500
min_search_chars = 2
; Buttons whose clicks are counted. Each is tagged data-track="<name>" on the website.
; Adding a name here does nothing until a button is tagged with it.
; Allowed: names of lowercase letters, digits and _ (start with a letter, 2 to 40 characters),
; comma separated, at least one. Default: the list below
buttons = add_to_enquiry, spec_sheet, price_sheet, whatsapp, call, send_enquiry, configurator, sample_quote
; Website pages counted by their address. Product and category pages count when the product or category
; exists. Any other address is saved as "other" (it could carry anything, like an email). Add new pages here.
; Allowed: addresses starting with /, only lowercase letters, digits, - and /, comma separated.
; Default: the list below
pages = /, /products, /categories, /contact, /partners, /private-label
; Visitors whose browser name contains one of these words are robots (search engines, link previews).
; Allowed: any words, comma separated (capitals don't matter). Default: the list below
bot_words = bot, crawl, spider, slurp, headless, lighthouse, preview, curl, wget, python, httpclient, facebookexternalhit
