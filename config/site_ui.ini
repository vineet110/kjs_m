; Home page look and motion (Nov 2026 refresh). No deploy needed: changes apply within about 1 minute.
; true = on, false = off. "Reduce motion" visitors never see the animations, whatever is set here.
[site_ui]
; The whole refresh: off = the home page look and motion as before (the partner list, with Dr. Reddy's, stays)
enabled = true
; Hero banner: seconds each slide stays before the next one (3 to 30)
slide_seconds = 6
; Soft glow pulsing around the Ask Koko and WhatsApp buttons, and seconds per pulse (1 to 10)
glow = true
glow_seconds = 3
; Category tiles and product cards come in from left to right when scrolled into view
reveal_left_to_right = true
; "How it works" steps light up 1 to 4 when scrolled into view
steps_light_up = true
; Milliseconds between two steps lighting up (100 to 2000)
steps_gap_ms = 450
; Thin strip above the header: since 2020, certificates, phone, email (scrolls away, every website page)
top_strip = true
; ☀/☾ button in the header for a dark website. dark_follows_system: true = visitors whose phone or computer
; is in dark mode get the dark website until they press the button; false = light until they press it
theme_toggle = true
dark_follows_system = false
; Sliding partner and certificate strip, and its speed in pixels per second (10 to 200)
partner_strip = true
partner_strip_px_per_second = 45

; ---------- Admin > Website > Hero ----------
; Most slides that can be switched on at once (1 to 10), and numbers in the stats box (1 to 6)
hero_max_slides = 5
hero_max_stats = 4
; Uploaded pictures are shrunk: longest side in pixels (400 to 4000), and JPEG/WebP quality (40 to 95)
image_max_px = 1600
image_quality = 82

; ---------- Admin > Website > Partner logos and Pop-up activity ----------
; Partners that can be on in the sliding strip (1 to 40)
partners_max = 12
; Activity lines older than this many days stop showing by themselves (1 to 365): never stale news
activity_max_age_days = 60
; Lines the website loads at most (5 to 500)
activity_public_max = 100
