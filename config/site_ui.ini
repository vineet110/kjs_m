; Home page look and motion (Nov 2026 refresh). The website updates within about 1 minute, no deploy.
; "Reduce motion" visitors never see the animations, whatever is set here.
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[site_ui]
; The whole refresh: off = the home page look and motion as before (the partner list, with Dr. Reddy's, stays).
; Allowed: true / false. Default: true
enabled = true
; Hero banner: seconds each slide stays before the next one. Allowed: 3 to 30. Default: 6
slide_seconds = 6
; Soft glow pulsing around the Ask Koko and WhatsApp buttons. Allowed: true / false. Default: true
glow = true
; Seconds per pulse. Allowed: 1 to 10. Default: 3
glow_seconds = 3
; Category tiles and product cards come in from left to right when scrolled into view.
; Allowed: true / false. Default: true
reveal_left_to_right = true
; "How it works" steps light up 1 to 4 when scrolled into view. Allowed: true / false. Default: true
steps_light_up = true
; Milliseconds between two steps lighting up. Allowed: 100 to 2000. Default: 450
steps_gap_ms = 450
; Thin strip above the header: since 2020, certificates, phone, email (scrolls away, every website page).
; Allowed: true / false. Default: true
top_strip = true
; ☀/☾ button in the header for a dark website. Allowed: true / false. Default: true
theme_toggle = true
; true = visitors whose phone or computer is in dark mode get the dark website until they press the
; button; false = light until they press it. Allowed: true / false. Default: false
dark_follows_system = false
; Sliding partner and certificate strip. Allowed: true / false. Default: true
partner_strip = true
; Its speed in pixels per second. Allowed: 10 to 200. Default: 45
partner_strip_px_per_second = 45

; ---------- Admin > Website > Hero ----------
; Most slides that can be switched on at once. Allowed: 1 to 10. Default: 5
hero_max_slides = 5
; Numbers in the stats box. Allowed: 1 to 6. Default: 4
hero_max_stats = 4
; Uploaded pictures are shrunk: longest side in pixels. Allowed: 400 to 4000. Default: 1600
image_max_px = 1600
; JPEG/WebP quality after shrinking. Allowed: 40 to 95. Default: 82
image_quality = 82

; ---------- Admin > Website > Partner logos and Pop-up activity ----------
; Partners that can be on in the sliding strip. Allowed: 1 to 40. Default: 12
partners_max = 12
; Activity lines older than this many days stop showing by themselves: never stale news.
; Allowed: 1 to 365. Default: 60
activity_max_age_days = 60
; Lines the website loads at most. Allowed: 5 to 500. Default: 100
activity_public_max = 100

; ---------- The site talks (hover messages, nudges, "Get your offer" box) ----------
; Texts are in Admin > Website > Text & SEO (keys talk.* and offer.*)
; Hover messages and nudges. Allowed: true / false. Default: true
talk = true
; false = only on the home page; true = every website page. Allowed: true / false. Default: false
talk_all_pages = false
; Example searches type themselves in the search box. Allowed: true / false. Default: true
typing_search = true
; A nudge stays this many seconds. Allowed: 2 to 20. Default: 5
bubble_seconds = 5
; Koko speaks once after this many seconds without a move. Allowed: 5 to 300. Default: 20
idle_seconds = 20
; Phones (no hover): Koko, then WhatsApp, each speaks once per visit after this many seconds.
; Allowed: Koko 2 to 120, WhatsApp 2 to 300. Default: 6 and 16
phone_koko_seconds = 6
phone_whatsapp_seconds = 16
; "Get your offer" box on the left edge, its pop-ups and the offer form. Allowed: true / false. Default: true
offer_box = true
; Pop-up times in seconds after the page opens (5, then 3 s later at 8 ...). Then the same again.
; Allowed: 1 to 20 numbers, each 1 to 600, rising, no repeats, comma separated. Default: 5, 8, 11, 15, 17, 25
popup_times = 5, 8, 11, 15, 17, 25
; A pop-up stays this many seconds, then fades. Allowed: 1 to 30. Default: 4
popup_show_seconds = 4
; How slowly it fades, in milliseconds. Allowed: 200 to 5000. Default: 1800
popup_fade_ms = 1800
; At most this many pop-ups at once on a computer. Allowed: 1 to 5. Default: 3
popups_on_screen = 3
; At most this many pop-ups at once on a phone. Allowed: 1 to 3. Default: 1
popups_on_screen_phone = 1
; Then none after this many per visit. Allowed: 1 to 200. Default: 20
popups_per_visit = 20
; An untouched offer form closes itself after this many seconds. Allowed: 5 to 120. Default: 14
form_open_seconds = 14
; The "about to slip away" warning shows this many seconds before.
; Allowed: 1 to 30, and less than form_open_seconds. Default: 4
form_warn_seconds = 4
