; Lead response targets
[sla]
; First response (mark "contacted") within this many minutes
respond_minutes = 20
; Close within this many minutes
resolve_minutes = 60
; Tell admins when a lead is this many minutes past its target
escalate_after_minutes = 30

; Note: the SLA clock only runs in working hours (shift_start-shift_end in app.ini,
; Mon-Sat, minus holidays). A lead created outside those hours starts its clock at the
; next shift start. Example: respond_minutes = 20 and escalate_after_minutes = 30 means
; the "not answered" alert goes out about 50 minutes after the clock starts.
