; Lead response targets
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[sla]
; First response (mark "contacted") within this many minutes. Allowed: 1 or more. Default: 20
respond_minutes = 20
; Close within this many minutes. Allowed: 1 or more. Default: 60
resolve_minutes = 60
; Tell admins when a lead is this many minutes past its target. Allowed: 0 or more. Default: 10
escalate_after_minutes = 30

; Note: the SLA clock only runs in working hours (shift_start-shift_end in app.ini,
; Mon-Sat, minus holidays). A lead created outside those hours starts its clock at the
; next shift start. Example: respond_minutes = 20 and escalate_after_minutes = 30 means
; the "not answered" alert goes out about 50 minutes after the clock starts.
