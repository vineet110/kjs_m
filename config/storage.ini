; File uploads (order boards, products, leads)
[storage]
; nginx caps uploads at 26 MB (deploy/nginx/default.conf): 25 at most here; raise both together
; Biggest file allowed, in MB
max_upload_mb = 25
; Allowed file extensions
allowed_types = pdf, png, jpg, jpeg, webp, xlsx, xls, docx, doc, csv, txt, zip, pptx, ppt, gif, heic, mp4, mov
