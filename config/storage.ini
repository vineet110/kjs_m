; File uploads (order boards, products, leads)
;
; ---------- How to edit (the same in every config file) ----------
; One setting per line: key = value. Text after ; is a note. Saved changes apply in about 3 seconds.
; Yes/no settings: write true or false. Numbers: digits only, no units. Never use the percent sign.
; Copy key names exactly: a misspelt key name is ignored WITHOUT any error, and its default is used.
; A wrong value (typo, out of range): the whole file is refused, its last good values stay, the log says why.
; Default = the value used when the line is missing. A server env var KJS__<FILE>__<KEY> beats this file.
; ------------------------------------------------------------------
[storage]
; Biggest file allowed, in MB. nginx caps uploads at 26 MB (deploy/nginx/default.conf): raise both together.
; Allowed: 1 to 25. Default: 25
max_upload_mb = 25
; Allowed file extensions. Remove one to block it.
; Allowed: lowercase, no dot, comma separated, only from this list (the code knows no other type, so
; adding a new one, e.g. svg, does nothing): pdf, png, jpg, jpeg, webp, xlsx, xls, docx, doc, csv, txt,
; zip, pptx, ppt, gif, heic, mp4, mov. Default: all of them
allowed_types = pdf, png, jpg, jpeg, webp, xlsx, xls, docx, doc, csv, txt, zip, pptx, ppt, gif, heic, mp4, mov
