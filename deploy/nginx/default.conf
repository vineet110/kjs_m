# nginx in front of the app (production). Live Hostinger VPS: host nginx (HTTPS) → this nginx → app.
# (Older plan: Cloudflare → cloudflared (tunnel) → this nginx. See deploy/README.md section 1.)
# /api/* goes straight to FastAPI; everything else to Next.js.

# Docker's own DNS. Every deploy replaces the app containers and their addresses may change, so nginx
# looks the names up again every 10 s ("resolve" below) instead of only once at start.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep connections to the app open between requests (faster). keepalive_timeout 4s: close an idle
# connection before the app does (uvicorn and Next.js close after 5 s); otherwise nginx sometimes
# sends a request on a just-closed connection and the visitor gets a random 502.
upstream kjs_api { zone kjs_api 64k; server backend:8000 resolve; keepalive 16; keepalive_timeout 4s; }
upstream kjs_web { zone kjs_web 64k; server frontend:3000 resolve; keepalive 16; keepalive_timeout 4s; }

# The visitor's real IP (R118 review). Whatever sits in front of us (host nginx on the VPS, or
# cloudflared) is on the Docker network or this machine and adds the visitor to X-Forwarded-For.
# realip takes the last address in that list that is NOT one of those trusted hops, so a visitor who
# sends their own X-Forwarded-For can't pick their IP. $remote_addr is then the real visitor.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# https when the front proxy doesn't say (the site only runs on https)
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" https; }

# Smaller responses for text (HTML, JSON, CSS, JS)
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

# Hide the nginx version in error pages and headers
server_tokens off;

# ---- Short page cache for the public website (go-live PR 11) ----
# The load test (26 Nov) handled about 300 visitors at once: every public page was rendered fresh by
# Next.js for every visit (Next sends no-store). The website looks the same for every visitor (one
# language, nothing read from cookies), so nginx keeps each public page for 10 s and serves copies:
# Next.js renders a page at most once per 10 s, however many people open it.
#   Not cached: the portal (/employee, /admin), the API, /healthz, Next's in-app page data (RSC requests),
#   anything but 200 answers. An admin change shows on the website within 10 s. deploy.sh empties the
#   cache on every deploy (cached pages name the old build's script files).
#   Known risk: a page that starts streaming (200) and then fails shows its error screen to everyone for
#   up to 10 s. Next.js middleware (proxy.ts) doesn't run for a cached copy, and no public page may set
#   a cookie (Set-Cookie is removed here). Kept in this file, not config/*.ini: nginx can't read the
#   app's ini files, and the switch must work even when the app is down.
# SWITCH: to turn it off, change the 0 to 1 below and reload nginx
#   (docker compose -f docker-compose.prod.yml exec nginx nginx -s reload). Check: the X-Page-Cache
#   header on a page is HIT / MISS while on, BYPASS while off.
map $host $page_cache_off { default 0; }
proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=kjs_pages:10m max_size=200m inactive=10m use_temp_path=off;
# Skip the cache for in-app page data (Next sends an RSC header) and when switched off
map "$http_rsc$page_cache_off" $page_cache_skip { "0" 0; default 1; }

server {
    listen 80;
    server_name _;

    # Normal requests are small. Only the two upload addresses accept big bodies (below), so nobody
    # can push 26 MB bodies at any other address, logged in or not.
    client_max_body_size 1m;

    # Who the visitor really is (backlog A45). FastAPI trusts these only because nginx is on
    # our own Docker network. CF-Connecting-IP is removed: there is no Cloudflare in front on the
    # Hostinger VPS, so any value would come from the visitor, and client_ip() trusts it first (a faked
    # one would get a fresh rate limit on every login try). The real IP is in X-Forwarded-For (realip above).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header CF-Connecting-IP "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Errors nginx makes itself on API addresses (file too big, API down or slow) answer in JSON like
    # the API does, not as an HTML page (ZAP SEC-07). The API's own errors pass through unchanged.
    location @api_error {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;  # an error is never kept (as the API's own errors)
        return 200 '{"code":"server_error","message":"The server could not answer. Please try again."}';
    }
    location @api_too_big {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 '{"code":"too_large","message":"This file or request is too big."}';
    }

    # Server-to-server feeds (laptop monitoring): only over the private Docker network, never from outside.
    # tests/test_monitoring_link.py checks this block is still here.
    location ^~ /api/v1/integrations/ {
        return 404;
    }

    # FastAPI. No trailing slash on proxy_pass: the /api prefix must reach the app unchanged.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        error_page 502 =502 @api_error;
        error_page 503 =503 @api_error;
        error_page 504 =504 @api_error;
        error_page 413 =413 @api_too_big;
        proxy_pass http://kjs_api;
        proxy_read_timeout 60s;  # Koko answers can take a few seconds
    }

    # Uploads: config/storage.ini allows 25 MB; a little extra for the form around the file
    location = /api/v1/files {
        include /etc/nginx/snippets/security-headers.conf;
        error_page 502 =502 @api_error;
        error_page 503 =503 @api_error;
        error_page 504 =504 @api_error;
        error_page 413 =413 @api_too_big;
        client_max_body_size 26m;
        proxy_pass http://kjs_api;
    }
    location = /api/v1/assign/import {
        include /etc/nginx/snippets/security-headers.conf;
        error_page 502 =502 @api_error;
        error_page 503 =503 @api_error;
        error_page 504 =504 @api_error;
        error_page 413 =413 @api_too_big;
        client_max_body_size 26m;
        proxy_pass http://kjs_api;
        proxy_read_timeout 120s;  # a big Excel file takes a while to read
    }
    # Lead files (config/leads.ini file_max_mb, at most 25): read into the form, or previewed for a bulk import
    location ~ ^/api/v1/employee/leads/(read-file|import/preview)$ {
        include /etc/nginx/snippets/security-headers.conf;
        error_page 502 =502 @api_error;
        error_page 503 =503 @api_error;
        error_page 504 =504 @api_error;
        error_page 413 =413 @api_too_big;
        client_max_body_size 26m;
        proxy_pass http://kjs_api;
        proxy_read_timeout 120s;
    }

    # KJS Chat live push (WebSocket). A WebSocket starts as a normal request that asks to "upgrade";
    # nginx must pass the Upgrade and Connection headers on (the server block above blanks Connection).
    # It stays open for hours: the app pings every 30 s, so 1h only ends truly dead connections.
    location = /api/v1/chat/ws {
        include /etc/nginx/snippets/security-headers.conf;
        error_page 502 =502 @api_error;
        error_page 503 =503 @api_error;
        error_page 504 =504 @api_error;
        proxy_pass http://kjs_api;
        # Any proxy_set_header here drops ALL the server-level ones, so repeat them (real IP, A45).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Next.js build files have a hash in their name, so they can be cached for a year
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_web;
        proxy_hide_header Cache-Control;  # replace Next's header instead of sending two
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Portal pages: never cached (they show who is logged in)
    location ~ ^/(employee|admin)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_web;
    }

    # Next's own addresses (pictures from /_next/image vary by browser): not cached here
    location /_next/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_web;
    }

    # The deploy health check must see the live app, never a cached copy (CR2)
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_web;
    }

    # Public website: the 10 s page cache (see the top of this file)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_web;
        # Ask Next.js for plain pages: a cached gzip copy would reach a client that can't read it. nginx
        # compresses for each visitor itself (gzip on, above). Any proxy_set_header here drops ALL the
        # server-level ones, so they are repeated.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_cache kjs_pages;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 10s;
        proxy_cache_bypass $page_cache_skip;
        proxy_no_cache $page_cache_skip;
        # Next marks every page no-store and sets a language cookie (always "en"): ignore both here, and
        # never hand one visitor's cookie to another. One request refreshes a page; the others get the
        # previous copy meanwhile instead of all waiting on Next.js.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_cache_lock on;
        # The defaults are 5 s: a page that takes longer to render (a cold start, a busy server) would let every
        # waiting visitor through to Next.js at once, which is what broke the 1000-user load test. 15 s is
        # longer than any normal render and still a limit, so nobody waits forever if a render fails.
        proxy_cache_lock_timeout 15s;
        proxy_cache_lock_age 15s;
        proxy_cache_use_stale updating;  # not on error/timeout: never pass off an old page as a live one
        add_header X-Page-Cache $upstream_cache_status always;
    }
}
