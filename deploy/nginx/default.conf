# nginx in front of the app (production). Traffic: Cloudflare → cloudflared (tunnel) → nginx → app.
# /api/* goes straight to FastAPI; everything else to Next.js.

# Docker's own DNS. Every deploy replaces the app containers and their addresses may change, so nginx
# looks the names up again every 10 s ("resolve" below) instead of only once at start.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep connections to the app open between requests (faster). keepalive_timeout 4s: close an idle
# connection before the app does (uvicorn and Next.js close after 5 s); otherwise nginx sometimes
# sends a request on a just-closed connection and the visitor gets a random 502.
upstream kjs_api { zone kjs_api 64k; server backend:8000 resolve; keepalive 16; keepalive_timeout 4s; }
upstream kjs_web { zone kjs_web 64k; server frontend:3000 resolve; keepalive 16; keepalive_timeout 4s; }

# Smaller responses for text (HTML, JSON, CSS, JS)
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

# Hide the nginx version in error pages and headers
server_tokens off;

server {
    listen 80;
    server_name _;

    # Normal requests are small. Only the two upload addresses accept big bodies (below), so nobody
    # can push 26 MB bodies at any other address, logged in or not.
    client_max_body_size 1m;

    # Who the visitor really is (backlog A45). FastAPI trusts these only because nginx is on
    # our own Docker network. CF-Connecting-IP (set by Cloudflare) passes through untouched.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # FastAPI. No trailing slash on proxy_pass: the /api prefix must reach the app unchanged.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_api;
        proxy_read_timeout 60s;  # Koko answers can take a few seconds
    }

    # Uploads: config/storage.ini allows 25 MB; a little extra for the form around the file
    location = /api/v1/files {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 26m;
        proxy_pass http://kjs_api;
    }
    location = /api/v1/assign/import {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 26m;
        proxy_pass http://kjs_api;
        proxy_read_timeout 120s;  # a big Excel file takes a while to read
    }

    # KJS Chat live push (WebSocket). A WebSocket starts as a normal request that asks to "upgrade";
    # nginx must pass the Upgrade and Connection headers on (the server block above blanks Connection).
    # It stays open for hours: the app pings every 30 s, so 1h only ends truly dead connections.
    location = /api/v1/chat/ws {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_api;
        # Any proxy_set_header here drops ALL the server-level ones, so repeat them (real IP, A45).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Next.js build files have a hash in their name, so they can be cached for a year
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_web;
        proxy_hide_header Cache-Control;  # replace Next's header instead of sending two
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Website + portal
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://kjs_web;
    }
}
