# Security headers, included in every location of default.conf.
# (nginx rule: a location with its own add_header loses ALL headers from the server block,
#  so they live in this one file and every location includes it.)

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS: tell browsers to use only https for this site for a year (R70, ZAP SEC-03). The site only
# runs on https (http redirects), so this is safe. No includeSubDomains and no preload: other
# kjsindia.com addresses are not ours to force, and preload is hard to undo.
add_header Strict-Transport-Security "max-age=31536000" always;

# Content-Security-Policy: what the browser may load and run on our pages. Even if some bug ever
# lets an attacker put HTML on a page, scripts from other sites won't load and data can't be sent
# elsewhere. 'unsafe-inline' is needed by Next.js 14's inline scripts (nonces can come later).
# R2: product photos/files are served from Cloudflare R2 links in production.
# Site pictures and flags: the public bucket kjs-site-assets (ASSET_BASE_URL in deploy/.env). Most pictures
# go through Next.js (/_next/image, our own address); flags and the favicon load straight from the bucket.
# Swap the r2.dev address for https://cdn.kjsindia.com when the custom domain is connected.
# connect-src: staff login (Firebase) talks to Google's identitytoolkit and securetoken from the browser
# (R97.i). Already live on the server since 23 Nov; copied back here so a redeploy can't break login (R118).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com https://pub-2f2268655b7244e295313aaf35e31e54.r2.dev; media-src 'self' https://*.r2.cloudflarestorage.com; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
