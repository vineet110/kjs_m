# Security headers, included in every location of default.conf.
# (nginx rule: a location with its own add_header loses ALL headers from the server block,
#  so they live in this one file and every location includes it.)

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy: what the browser may load and run on our pages. Even if some bug ever
# lets an attacker put HTML on a page, scripts from other sites won't load and data can't be sent
# elsewhere. 'unsafe-inline' is needed by Next.js 14's inline scripts (nonces can come later).
# R2: product photos/files are served from Cloudflare R2 links in production.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; media-src 'self' https://*.r2.cloudflarestorage.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
