# Development databases only. The app itself runs directly on your PC (see README),
# and production uses deploy/docker-compose.prod.yml.

services:
  # Optional local database for development (we normally use Neon). Start: docker compose up -d db
  db:
    image: pgvector/pgvector:pg16
    container_name: kjs_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kjs_db}
      POSTGRES_USER: ${POSTGRES_USER:-kjs_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kjs_secret_pass}
    ports:
      - "127.0.0.1:5432:5432"  # this PC only: not reachable from the office network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/alembic/init_roles.sql:/docker-entrypoint-initdb.d/init_roles.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kjs_admin} -d ${POSTGRES_DB:-kjs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway database for automated tests (pytest). Start: docker compose --profile test up -d test-db
  test-db:
    image: pgvector/pgvector:pg16
    container_name: kjs_test_db
    profiles: ["test"]
    environment:
      POSTGRES_DB: kjs_test
      POSTGRES_USER: kjs_test
      POSTGRES_PASSWORD: kjs_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data  # in memory: fast, wiped on stop

volumes:
  pgdata:
