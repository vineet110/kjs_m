version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kjs_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kjs_db}
      POSTGRES_USER: ${POSTGRES_USER:-kjs_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kjs_secret_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/alembic/init_roles.sql:/docker-entrypoint-initdb.d/init_roles.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kjs_admin} -d ${POSTGRES_DB:-kjs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway database for automated tests (pytest). Start: docker compose up -d test-db
  test-db:
    image: pgvector/pgvector:pg16
    container_name: kjs_test_db
    profiles: ["test"]
    environment:
      POSTGRES_DB: kjs_test
      POSTGRES_USER: kjs_test
      POSTGRES_PASSWORD: kjs_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data  # in memory: fast, wiped on stop

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kjs_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./backend:/app
      - ./config:/config:ro  # edit config/*.ini on the server: applies live, no rebuild
      - file_storage:/srv/kjs_files
    ports:
      - "8000:8000"
    # Background jobs run inside this process (app/jobs), so no separate worker/scheduler
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kjs_nextjs
    depends_on:
      - backend
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    restart: unless-stopped

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: kjs_superset
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8088"
    restart: unless-stopped

volumes:
  pgdata:
  file_storage:
